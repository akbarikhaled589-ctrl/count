<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>جمع اعداد</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        input {
            padding: 10px;
            width: 80%;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>جمع اعداد</h2>
        <input type="text" id="numberInput" placeholder="عدد را وارد کنید">
        <button onclick="addNumber()">اضافه کردن</button>
        <div class="result" id="result">جمع: 0</div>
    </div>

    <script>
        let numbers = [];
        function addNumber() {
            const input = document.getElementById('numberInput');
            const value = parseFloat(input.value);
            if (!isNaN(value)) {
                numbers.push(value);
                const sum = numbers.reduce((a,b) => a+b, 0);
                document.getElementById('result').innerText = 'جمع: ' + sum;
                input.value = '';
            } else {
                alert('لطفاً یک عدد معتبر وارد کنید');
            }
        }
    </script>
</body>
</html>
