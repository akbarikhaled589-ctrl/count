<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>💰 حسابی گدام میهن 💰</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #f9f9f9, #c2e9fb);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            width: 400px;
            text-align: center;
        }
        h2 {
            color: #ff6f61;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            width: 80%;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
            text-align: center;
        }
        button {
            padding: 10px 25px;
            background: #ff6f61;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background: #e65550;
        }
        .result, .number-list {
            margin-top: 15px;
            font-size: 16px;
            color: #333;
        }
        .number-list {
            max-height: 180px;
            overflow-y: auto;
            padding: 10px;
            border: 2px dashed #ff6f61;
            border-radius: 12px;
            background: #fff7f5;
            margin-bottom: 10px;
        }
        .number-item {
            padding: 3px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💰 حسابی گدام میهن 💰</h2>
        <input type="text" id="numberInput" placeholder="عدد را وارد کنید (مثال: 1,2,3)">
        <button onclick="addNumber()">اضافه کردن</button>
        <div class="number-list" id="numberList"></div>
        <div class="result" id="result">جمع: 0</div>
    </div>

    <script>
        let numbers = [];

        function addNumber() {
            const input = document.getElementById('numberInput');
            const value = input.value.trim();

            if(value === '') {
                alert('لطفاً عدد وارد کنید');
                return;
            }

            // حمایت از چند عدد با کاما
            const parts = value.split(',').map(n => parseFloat(n.trim()));
            let validNumbers = parts.filter(n => !isNaN(n));

            if(validNumbers.length === 0) {
                alert('لطفاً عدد معتبر وارد کنید');
                return;
            }

            numbers = numbers.concat(validNumbers);
            updateListAndSum();
            input.value = '';
        }

        function updateListAndSum() {
            const listDiv = document.getElementById('numberList');
            listDiv.innerHTML = '';
            numbers.forEach((num, index) => {
                const div = document.createElement('div');
                div.className = 'number-item';
                div.innerText = `${index + 1}. ${num}`;
                listDiv.appendChild(div);
            });

            const sum = numbers.reduce((a,b) => a+b, 0);
            document.getElementById('result').innerText = 'جمع: ' + sum;
        }
    </script>
</body>
</html>
